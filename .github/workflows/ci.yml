name: NUAAI CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nuaai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Canonical release gate
        run: npm run gate

      - name: Diff hygiene
        run: git diff --check

      - name: Verify package contents on release tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm pack --dry-run
