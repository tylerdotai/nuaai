name: NUAAI CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nuaai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: npm run check

      - name: Unit and integration tests
        run: npm test

      - name: Strict per-file coverage
        run: npm run test:coverage

      - name: Build Node daemon
        run: npm run build

      - name: Build web dashboard
        run: npm run build:web

      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:e2e

      - name: Dependency audit
        run: npm audit --audit-level=low

      - name: Version and tag consistency
        run: npm run version:check

      - name: Diff hygiene
        run: git diff --check

      - name: Verify package contents on release tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm pack --dry-run
