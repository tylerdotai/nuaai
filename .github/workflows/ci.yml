name: NUAAI CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nuaai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome check + TypeScript
        run: npm run check

  unit:
    name: Unit tests with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit suite
        run: npm run test:unit

      - name: Unit coverage floor (55% global)
        run: npx vitest run --config vitest.unit.config.ts --coverage

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install media test tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg zip unzip

      - name: Install dependencies
        run: npm ci

      - name: Run integration suite
        run: npm run test:integration

      - name: Combined coverage gate (80% per-file)
        # Critical paths are covered by a mix of unit and integration tests.
        # Neither tier alone can hit 80% on every file — the unit tier
        # covers fast logic, the integration tier covers real SQLite / HTTP /
        # subprocess boundaries. The combined suite runs all tests with
        # coverage and enforces the per-file floor declared in
        # vitest.config.ts.
        run: npx vitest run --config vitest.config.ts --coverage

  e2e:
    name: End-to-end browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: integration
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install media test tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg zip unzip

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e

  mutation:
    name: Mutation testing (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: integration
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker against critical paths
        run: npm run test:mutate

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/

  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit, integration, e2e]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install media test tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg zip unzip

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Canonical release gate
        run: npm run gate

      - name: Diff hygiene
        run: git diff --check

      - name: Verify package contents on release tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm pack --dry-run
