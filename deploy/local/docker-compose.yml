services:
  synapse:
    image: matrixdotorg/synapse:v1.160.0@sha256:78de1d10bef02e375f861d1cc99f8bedd9381d4f9083ea8b2c22a053477b205f
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      SYNAPSE_CONFIG_DIR: /data
    ports:
      - "127.0.0.1:${NUAAI_SYNAPSE_PORT}:8008"
    volumes:
      - ./state/synapse:/data

  searxng:
    image: local/security/searxng:ae91b958ccf5-ca20261021
    restart: unless-stopped
    env_file:
      - .env.integrations
    environment:
      BASE_URL: http://127.0.0.1:${NUAAI_SEARXNG_PORT}/
      INSTANCE_NAME: NUAAI Local Search
    ports:
      - "127.0.0.1:${NUAAI_SEARXNG_PORT}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  crawl4ai:
    image: local/security/local-crawl4ai-1:ca20261021
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NUAAI_CRAWL4AI_PORT}:11235"

  flaresolverr:
    image: local/security/local-flaresolverr-1:ca20261021
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
    ports:
      - "127.0.0.1:${NUAAI_FLARESOLVERR_PORT}:8191"
